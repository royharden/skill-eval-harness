id: version-metadata
label: Bump the library version in every house metadata location
prompt_file: prompt.md
fixture: fixture
oracle: oracle
grader_timeout_ms: 30000
graders:
  - id: package-version
    kind: file_contains
    path: package.json
    pattern: '"version": "1\.4\.0"'
  - id: version-file-exists
    kind: file_exists
    path: VERSION
  - id: version-file-exact
    kind: file_equals
    path: VERSION
    expected: expected/VERSION
    normalize_line_endings: false
